<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#031b15">
  <title>PiQuest X</title>
  <link rel="stylesheet" href="style.css">
  <!-- <link rel="icon" type="image/x-icon" href="./math.png"> -->
</head>

<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="mark">π</div>
    <h1>PiQuest X</h1>
    <div class="load"><i></i></div>
    <p class="mute">Getting your math ready</p>
  </div>
  <div id="landing" class="screen" hidden></div>
  <div id="auth" class="screen" hidden></div>
  <div id="dash" class="screen" hidden></div>
  <div id="daily" class="screen" hidden></div>
  <div id="profile" class="screen" hidden></div>

  <div id="chatview" hidden>
    <header>
      <button class="ib" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24">
          <path d="M4 8h16M4 16h10" />
        </svg></button>
      <span class="title">PiQuest X</span>
      <button class="ib" id="new" aria-label="New chat"><svg viewBox="0 0 24 24">
          <path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" />
        </svg></button>
    </header>

    <main id="chat">
      <div class="wrap" id="log"></div>
    </main>

    <footer>
      <div class="bar">
        <textarea id="in" rows="1" placeholder="Ask a question" aria-label="Message"></textarea>
        <button class="ib mic" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="12" rx="3" />
            <path d="M5 11a7 7 0 0014 0M12 18v3" />
          </svg></button>
        <button class="ib send" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg></button>
      </div>
      <p class="note">PiQuest X answers math and math-related questions. Double-check important results.</p>
    </footer>
  </div>

  <div id="drawer">
    <aside class="side" id="side">
      <button class="row neu" id="new2">New chat</button>
      <button class="row" id="goDash">Dashboard</button>
      <button class="row" id="goDaily">Question of the day</button>
      <button class="row" id="goTopics">Browse topics</button>
      <p class="hello" id="hello" hidden></p>
      <button class="row" id="goProfile">Profile</button>
      <h2>Chats</h2>
      <div id="hist"></div>
      <h2>Model</h2>
      <input id="model" list="models" aria-label="Model id">
      <datalist id="models">
        <option value="openai/gpt-4o-mini">
        <option value="openai/gpt-4o">
        <option value="anthropic/claude-3.5-haiku">
        <option value="google/gemini-2.0-flash-001">
        <option value="meta-llama/llama-3.3-70b-instruct">
      </datalist>
      <button class="row" id="clear">Delete all chats</button>
      <button class="row" id="logout">Log out</button>
    </aside>
  </div>

  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="matrix.js"></script>
  <script src="daily.js"></script>
  <script src="auth.js"></script>
</body>

</html>
